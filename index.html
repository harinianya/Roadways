<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Roadway Builder</title>
<style>
:root{--panel:rgba(17,35,26,.92);--lime:#caff78;--cream:#fff8df}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79b75a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:stretch;pointer-events:none;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid #ffffff30;border-radius:14px;padding:8px 12px;box-shadow:0 4px 16px #122c1c33;font-size:12px;min-width:75px}
.pill b{display:block;font-size:16px;color:var(--lime)}
#cityName{min-width:140px}
#progressWrap{height:5px;background:#ffffff30;border-radius:9px;overflow:hidden;margin-top:5px}
#progress{height:100%;width:0;background:var(--lime)}
#bottom{position:fixed;bottom:10px;left:10px;right:10px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
button{border:1px solid #ffffff42;background:var(--panel);color:white;padding:11px 13px;border-radius:12px;font-weight:800;font-size:12px;box-shadow:0 4px 14px #132d1c40;cursor:pointer;touch-action:manipulation}
button.primary{background:var(--lime);color:#19301d;border-color:transparent}
button:disabled{opacity:.45}
#hint{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);max-width:min(92vw,620px);text-align:center;background:rgba(16,31,22,.88);padding:9px 14px;border-radius:12px;font-size:13px;box-shadow:0 4px 15px #142a1b30}
#toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:#fff8df;color:#203424;padding:10px 15px;border-radius:12px;font-weight:800;font-size:13px;display:none;max-width:90vw;text-align:center}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#102519b8;padding:20px}
#modal{background:#f8f5e7;color:#203424;border-radius:20px;padding:24px;max-width:380px;width:100%;text-align:center;box-shadow:0 18px 60px #0005}
#modal h1{margin:0 0 8px}#modal p{line-height:1.45}
@media(max-width:520px){.pill{padding:7px 9px;min-width:65px;font-size:10px}.pill b{font-size:14px}#cityName{min-width:120px}button{padding:10px 11px;font-size:11px}#bottom{gap:5px}#hint{bottom:112px;font-size:12px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Roadway Builder game"></canvas>
<div id="top">
  <div class="pill" id="cityName">CITY 1 <b>Green Meadows</b><div id="progressWrap"><div id="progress"></div></div></div>
  <div class="pill">CASH<b id="cash">$50</b></div>
  <div class="pill">ROADS<b id="roads">0 / 6</b></div>
  <div class="pill">TOLLS<b id="tollCount">0 / 1</b></div>
  <div class="pill">TRAFFIC<b id="traffic">Calm</b></div>
</div>
<div id="hint">Trace the glowing road from one endpoint to the central junction. Use your finger or mouse.</div>
<div id="toast"></div>
<div id="bottom">
  <button class="primary" id="drawBtn">DRAW ROAD</button>
  <button id="tollBtn">PLACE TOLL ($10)</button>
  <button id="shortcutBtn">BUILD SHORTCUT ($15)</button>
  <button id="upgradeBtn">UPGRADE ROAD ($25)</button>
  <button id="nextBtn" disabled>NEXT CITY</button>
  <button id="resetBtn">RESTART</button>
</div>
<div id="overlay"><div id="modal"><h1>City Complete! 🎉</h1><p>You connected every road in this city.</p><button class="primary" id="continueBtn">ENTER NEXT CITY</button></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const cityNames=['Green Meadows','Sunset Desert','Coral Coast','Pine Forest','Autumn Valley','Snowy Pass','Lakeside Town','Neon District'];
const themes=[
 {grass:'#75b85b',accent:'#d8c46c',name:'Meadow'},
 {grass:'#d6b46b',accent:'#f0d18a',name:'Desert'},
 {grass:'#64b7b1',accent:'#e6d08b',name:'Beach'},
 {grass:'#4e9860',accent:'#94bd74',name:'Forest'},
 {grass:'#b5a15f',accent:'#d77a49',name:'Autumn'},
 {grass:'#b8d6e2',accent:'#eaf4f6',name:'Snow'},
 {grass:'#72ad86',accent:'#7ec8d1',name:'Lake'},
 {grass:'#303d52',accent:'#a9f2b6',name:'Neon'}
];
let W=0,H=0,dpr=1,city=0,cash=50,roadLevel=1,roads=[],shortcuts=[],tolls=[],cars=[],particles=[],targets=[],activeTarget=0,mode='draw',drawing=false,trace=[],toastTimer=0,lastTime=0,spawnTimer=0,complete=false,citySeed=1;
const rand=()=>{citySeed=(citySeed*1664525+1013904223)>>>0;return citySeed/4294967296};
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);makeTargets();draw()}
window.addEventListener('resize',resize);
function hub(){return {x:W*.5,y:H*.49}}
function makeTargets(){
 citySeed=city*9871+321;
 const c=hub(),margin=Math.max(55,Math.min(W,H)*.09);
 const n=6,angles=[];
 for(let i=0;i<n;i++)angles.push((Math.PI*2*i/n)+(rand()-.5)*.55);
 // Randomize the order of edge positions and create curved routes that all join the hub.
 targets=[];
 for(let i=0;i<n;i++){
  const a=angles[i],len=.36+rand()*.13;
  const edge={x:c.x+Math.cos(a)*(W*len),y:c.y+Math.sin(a)*(H*len)};
  edge.x=Math.max(margin,Math.min(W-margin,edge.x));edge.y=Math.max(105,Math.min(H-95,edge.y));
  const perp={x:-Math.sin(a),y:Math.cos(a)},bend=(rand()-.5)*Math.min(W,H)*.24;
  const p1={x:edge.x*.68+c.x*.32+perp.x*bend,y:edge.y*.68+c.y*.32+perp.y*bend};
  const p2={x:edge.x*.34+c.x*.66-perp.x*bend*.5,y:edge.y*.34+c.y*.66-perp.y*bend*.5};
  const pts=[];for(let j=0;j<=70;j++){const t=j/70,u=1-t;pts.push({x:u*u*u*edge.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*c.x,y:u*u*u*edge.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*c.y})}
  targets.push({pts,edge,idx:i});
 }
 // Reorder randomly so cities don't have a fixed road-building sequence.
 targets.sort(()=>rand()-.5);targets.forEach((t,i)=>t.idx=i);
}
function roadCount(){return roads.length}
function tollLimit(){return 1+Math.floor(city/2)}
function updateUI(){
 $('cityName').innerHTML=`CITY ${city+1} <b>${cityNames[city%cityNames.length]}</b><div id="progressWrap"><div id="progress"></div></div>`;
 $('cash').textContent='$'+cash;$('roads').textContent=`${roads.length} / ${targets.length}`;
 $('tollCount').textContent=`${tolls.length} / ${tollLimit()}`;
 $('traffic').textContent=roads.length<2?'Calm':roads.length<5?'Busy':'Heavy';
 const prog=document.getElementById('progress');if(prog)prog.style.width=(roads.length/targets.length*100)+'%';
 $('nextBtn').disabled=!complete;
 $('drawBtn').textContent=mode==='draw'?'DRAW ROAD':'CANCEL MODE';
 $('tollBtn').textContent=mode==='toll'?'TAP ROAD TO PLACE':'PLACE TOLL ($10)';
 $('shortcutBtn').textContent=mode==='shortcut'?'TRACE SHORTCUT':'BUILD SHORTCUT ($15)';
}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2200)}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearestOnRoad(p){
 let best=null,d=Infinity;
 roads.forEach((r,ri)=>r.pts.forEach((q,qi)=>{let v=distance(p,q);if(v<d){d=v;best={x:q.x,y:q.y,road:ri,t:qi/(r.pts.length-1)}}}));
 shortcuts.forEach((r,ri)=>r.pts.forEach((q,qi)=>{let v=distance(p,q);if(v<d){d=v;best={x:q.x,y:q.y,road:roads.length+ri,t:qi/(r.pts.length-1)}}}));
 return best?{...best,d}:null;
}
function pointer(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{
 if(complete)return;
 const p=pointer(e);
 if(mode==='toll'){
  const n=nearestOnRoad(p);
  if(!n||n.d>35){toast('Tap directly on a built road to place the toll.');return}
  if(tolls.length>=tollLimit()){toast('You have reached this city’s toll limit.');return}
  if(cash<10){toast('Not enough cash. A toll costs $10.');return}
  cash-=10;tolls.push({x:n.x,y:n.y,road:n.road,t:n.t,lastPaid:0});mode='draw';updateUI();draw();toast('Toll placed! Cars passing here earn $2.');return;
 }
 if(mode==='draw'){
  const target=targets.find(t=>!roads.some(r=>r.target===t.idx));
  if(!target){toast('All roads are already connected!');return}
  // Start tracing anywhere near the glowing route; the trace is validated on release.
  drawing=true;trace=[p];canvas.setPointerCapture?.(e.pointerId);
 }else if(mode==='shortcut'){
  if(roads.length<2){toast('Build at least two roads first.');mode='draw';updateUI();return}
  drawing=true;trace=[p];canvas.setPointerCapture?.(e.pointerId);
 }
});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;trace.push(pointer(e));draw()});
canvas.addEventListener('pointerup',e=>{
 if(!drawing)return;drawing=false;trace.push(pointer(e));
 if(mode==='draw')finishRoad();
 else if(mode==='shortcut')finishShortcut();
 trace=[];draw();
});
canvas.addEventListener('pointercancel',()=>{drawing=false;trace=[];draw()});
function pointDistanceToPolyline(p,pts){let d=Infinity;for(let i=0;i<pts.length;i++)d=Math.min(d,distance(p,pts[i]));return d}
function finishRoad(){
 if(trace.length<5){toast('Press and drag along the glowing route.');return}
 const target=targets.find(t=>!roads.some(r=>r.target===t.idx));
 if(!target)return;
 // A valid trace must travel near the route and reach both its outer end and central junction.
 const start=trace[0],end=trace[trace.length-1],pts=target.pts;
 const forward=distance(start,pts[0])+distance(end,pts[pts.length-1]);
 const reverse=distance(start,pts[pts.length-1])+distance(end,pts[0]);
 const endpoints=Math.min(forward,reverse);
 let near=0;for(let i=0;i<trace.length;i+=Math.max(1,Math.floor(trace.length/25)))if(pointDistanceToPolyline(trace[i],pts)<Math.max(32,roadLevel*5))near++;
 const ratio=near/Math.ceil(trace.length/Math.max(1,Math.floor(trace.length/25)));
 if(endpoints>Math.max(110,Math.min(W,H)*.27)||ratio<.42){toast('Follow the highlighted path from the edge to the central junction.');return}
 roads.push({pts:pts.map(p=>({...p})),target:target.idx,level:roadLevel});
 cash+=8+roads.length*2;makeCars();updateUI();sound(520,.08);toast('Road connected! +$'+(8+roads.length*2));
 if(roads.length===targets.length){complete=true;$('overlay').style.display='flex';$('hint').textContent='City complete! Enter the next city when ready.'}
}
function finishShortcut(){
 if(trace.length<5){toast('Drag a shortcut between two existing roads.');return}
 const a=nearestOnRoad(trace[0]),b=nearestOnRoad(trace[trace.length-1]);
 if(!a||!b||a.d>36||b.d>36||distance(a,b)<70){toast('Start and finish the shortcut on two different roads.');return}
 if(cash<15){toast('A shortcut costs $15.');return}
 // Use the player's drawn trace as the shortcut path, snapping endpoints to roads.
 const pts=trace.filter((_,i)=>i%Math.max(1,Math.floor(trace.length/55))===0).map(p=>({...p}));pts[0]={x:a.x,y:a.y};pts[pts.length-1]={x:b.x,y:b.y};
 cash-=15;shortcuts.push({pts});mode='draw';updateUI();toast('Shortcut connected! Cars can use it.');sound(700,.1)
}
$('drawBtn').onclick=()=>{mode=mode==='draw'?'none':'draw';updateUI();toast(mode==='draw'?'Trace the highlighted road.':'Road drawing paused.')};
$('tollBtn').onclick=()=>{if(mode==='toll'){mode='draw'}else{if(!roads.length){toast('Build a road before placing a toll.');return}if(tolls.length>=tollLimit()){toast('Toll limit reached for this city.');return}if(cash<10){toast('A toll costs $10.');return}mode='toll'}updateUI();draw()};
$('shortcutBtn').onclick=()=>{if(mode==='shortcut'){mode='draw';updateUI();return}if(roads.length<2){toast('Build at least two roads first.');return}if(cash<15){toast('A shortcut costs $15.');return}mode='shortcut';updateUI();toast('Drag from one built road to another to create a shortcut.');draw()};
$('upgradeBtn').onclick=()=>{if(cash<25){toast('A road upgrade costs $25.');return}cash-=25;roadLevel=Math.min(4,roadLevel+1);roads.forEach(r=>r.level=roadLevel);updateUI();draw();toast('Roads upgraded to level '+roadLevel+'!')};
$('nextBtn').onclick=nextCity;$('continueBtn').onclick=nextCity;
$('resetBtn').onclick=()=>{city=0;cash=50;roadLevel=1;roads=[];shortcuts=[];tolls=[];cars=[];complete=false;mode='draw';$('overlay').style.display='none';makeTargets();updateUI();makeCars();draw();toast('Game restarted.')};
function nextCity(){if(!complete)return;city++;roads=[];shortcuts=[];tolls=[];cars=[];complete=false;mode='draw';$('overlay').style.display='none';makeTargets();updateUI();makeCars();draw();toast('New city generated with a fresh random road layout!')}
function makeCars(){while(cars.length<Math.min(2+roads.length*2,16))cars.push({route:Math.floor(rand()*Math.max(1,roads.length)),t:rand(),speed:.035+rand()*.025,lane:(rand()-.5)*5,color:['#f7d56b','#f5f5ee','#e77e66','#7ad9e5'][Math.floor(rand()*4)],lastToll:0})}
function sound(freq,dur){try{const ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.stop(ac.currentTime+dur)}catch(e){}}
function strokeRoad(pts,color,width,dash=[]){if(!pts||pts.length<2)return;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}
function roadAt(pts,t){const i=Math.max(0,Math.min(pts.length-2,Math.floor(t*(pts.length-1))));const f=t*(pts.length-1)-i;return{x:pts[i].x+(pts[i+1].x-pts[i].x)*f,y:pts[i].y+(pts[i+1].y-pts[i].y)*f}}
function drawBackground(){
 const theme=themes[city%themes.length];ctx.fillStyle=theme.grass;ctx.fillRect(0,0,W,H);
 // softly textured landscape
 for(let i=0;i<100;i++){const x=(i*137.7+city*31)%W,y=(i*91.3+city*47)%H;ctx.fillStyle=i%3===0?'#ffffff0b':'#173c1b0b';ctx.beginPath();ctx.ellipse(x,y,12+(i%7)*2,5+(i%4),rand()*.3,0,Math.PI*2);ctx.fill()}
 // decorative trees / rocks away from central area
 for(let i=0;i<32;i++){const x=(i*173+city*83)%W,y=(i*119+city*61)%H;if(distance({x,y},hub())<Math.min(W,H)*.14)continue;
  if(city%themes.length===1){ctx.fillStyle='#b88942';ctx.beginPath();ctx.arc(x,y,7+(i%4),0,Math.PI*2);ctx.fill()}
  else if(city%themes.length===2){ctx.fillStyle='#d8c58b';ctx.beginPath();ctx.ellipse(x,y,11,5,.4,0,Math.PI*2);ctx.fill()}
  else{ctx.fillStyle=theme.accent;ctx.beginPath();ctx.arc(x,y,3+(i%4),0,Math.PI*2);ctx.fill();if(i%2===0){ctx.fillStyle='#315f37';ctx.fillRect(x-2,y+3,4,9)}}
 }
}
function drawCar(c,pts){
 const p=roadAt(pts,c.t),p2=roadAt(pts,Math.min(.999,c.t+.004)),ang=Math.atan2(p2.y-p.y,p2.x-p.x);
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang);ctx.fillStyle='#0004';ctx.fillRect(-9+c.lane, -4,20,11);ctx.fillStyle=c.color;ctx.fillRect(-10+c.lane,-5,20,10);ctx.fillStyle='#c8f2f2';ctx.fillRect(1+c.lane,-3,5,6);ctx.fillStyle='#252b2a';ctx.fillRect(-7+c.lane,-7,5,3);ctx.fillRect(5+c.lane,-7,5,3);ctx.fillRect(-7+c.lane,4,5,3);ctx.fillRect(5+c.lane,4,5,3);ctx.restore();
}
function drawToll(t,i){
 ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle='#20372b';ctx.fillRect(-15,-24,30,27);ctx.fillStyle='#ffe59a';ctx.fillRect(-12,-21,24,20);ctx.fillStyle='#243a2a';ctx.font='bold 8px system-ui';ctx.textAlign='center';ctx.fillText('TOLL '+(i+1),0,-8);ctx.fillStyle='#f5f0d9';ctx.fillRect(-20,3,40,5);ctx.fillStyle='#fff';ctx.fillRect(-18,-29,4,31);ctx.fillRect(14,-29,4,31);ctx.restore();
}
function draw(){
 if(!W||!H)return;drawBackground();
 // Show all unbuilt randomized paths; completed routes remain connected at the common junction.
 targets.forEach(t=>{if(roads.some(r=>r.target===t.idx))return;strokeRoad(t.pts,'#ffffff1c',Math.max(12,roadLevel*5));strokeRoad(t.pts,'#fff8dc99',2,[5,10]);const e=t.pts[0];ctx.fillStyle='#fff5c4';ctx.beginPath();ctx.arc(e.x,e.y,6,0,Math.PI*2);ctx.fill();});
 roads.forEach(r=>{strokeRoad(r.pts,'#27302c',Math.max(15,roadLevel*6));strokeRoad(r.pts,'#e8e9dd',2,[12,12]);strokeRoad(r.pts,'#ffffff18',Math.max(1,roadLevel-1));});
 shortcuts.forEach(s=>{strokeRoad(s.pts,'#27302c',Math.max(13,roadLevel*5));strokeRoad(s.pts,'#e8e9dd',2,[10,10]);});
 // Central junction ties all roads together visually.
 if(roads.length){const c=hub();ctx.fillStyle='#28302d';ctx.beginPath();ctx.arc(c.x,c.y,Math.max(18,roadLevel*8),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e8e9dd';ctx.lineWidth=2;ctx.setLineDash([7,8]);ctx.beginPath();ctx.arc(c.x,c.y,Math.max(12,roadLevel*6),0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff7d4';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('JUNCTION',c.x,c.y-30)}
 // Draw guide for next road.
 const target=targets.find(t=>!roads.some(r=>r.target===t.idx));
 if(target&&mode==='draw'){strokeRoad(target.pts,'#baff60',Math.max(4,roadLevel+2));const e=target.pts[0];ctx.fillStyle='#d7ff91';ctx.beginPath();ctx.arc(e.x,e.y,10+Math.sin(performance.now()/160)*2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#243d20';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('START',e.x,e.y-17)}
 if(mode==='toll'){ctx.fillStyle='#fff7c4';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('TAP A BUILT ROAD TO PLACE YOUR TOLL',W/2,H-145)}
 if(mode==='shortcut'){ctx.fillStyle='#fff7c4';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('DRAG FROM ONE ROAD TO ANOTHER',W/2,H-145)}
 if(drawing&&trace.length>1)strokeRoad(trace,mode==='shortcut'?'#ffd65a':'#ffffff',4);
 // toll booths
 tolls.forEach(drawToll);
 // Cars travel on roads and shortcuts.
 const paths=roads.map(r=>r.pts).concat(shortcuts.map(s=>s.pts));
 cars.forEach((c,i)=>{if(!paths.length)return;c.route=c.route%paths.length;drawCar(c,paths[c.route]);});
}
function tick(now){
 const dt=Math.min(.05,(now-lastTime)/1000||0);lastTime=now;spawnTimer+=dt;
 if(roads.length&&spawnTimer>Math.max(.65,2.3-roads.length*.22)){spawnTimer=0;if(cars.length<Math.min(2+roads.length*2,16))makeCars()}
 const paths=roads.map(r=>r.pts).concat(shortcuts.map(s=>s.pts));
 cars.forEach((c,i)=>{if(!paths.length)return;c.route=c.route%paths.length;c.t+=c.speed*dt*(1+roads.length*.08);if(c.t>=1){c.t=0;c.route=(c.route+1)%paths.length}
  tolls.forEach(t=>{if(t.road===c.route&&Math.abs(c.t-t.t)<.009&&now-t.lastPaid>1200){cash+=2;t.lastPaid=now;particles.push({x:t.x,y:t.y-18,life:1,text:'+$2'});updateUI()}});
 });
 particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.life-=dt;p.y-=20*dt;ctx.fillStyle=`rgba(255,244,151,${Math.max(0,p.life)})`;ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y)});
 draw();requestAnimationFrame(tick);
}
makeTargets();updateUI();makeCars();resize();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
